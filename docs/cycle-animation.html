<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EOAT cell — animated 3D stack</title>
  <style>
    :root { --bg: #121417; --panel: #1b1e23; --line: #2c3138; --txt: #e8eaed; --dim: #9aa3ad; --acc: #6aa7e8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 14px/1.4 system-ui, sans-serif; }
    .app { display: grid; grid-template-columns: 240px 1fr 260px; height: 100%; }
    @media (max-width: 980px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } }
    aside, .rail { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow: auto; }
    .rail { border-right: none; border-left: 1px solid var(--line); }
    h1 { font-size: 15px; margin: 0 0 6px; }
    h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; }
    p { color: var(--dim); margin: 0 0 12px; }
    button {
      background: #2a313a; color: var(--txt); border: 1px solid #3a424c; padding: 7px 10px; margin: 0 6px 6px 0; cursor: pointer;
    }
    button.primary { background: #2d5d8c; border-color: #3d7eb8; }
    button:hover { border-color: var(--acc); }
    .stage { position: relative; min-height: 420px; }
    svg { width: 100%; height: 100%; display: block; }
    .bar { position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: center; gap: 10px; }
    input[type=range] { flex: 1; }
    .phase { font-variant-numeric: tabular-nums; color: var(--acc); min-width: 11em; }
    .item { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-bottom: 1px solid var(--line); }
    .item b { display: block; font-weight: 600; }
    .item span { color: var(--dim); font-size: 12px; }
    .dot { width: 8px; height: 8px; margin-top: 5px; flex: 0 0 8px; }
    .on b { color: #fff; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Full stack — not an arm</h1>
      <p>One gantry X, a short Z on the tool, jaws that only open and close. Everything else is fixtures, sensors, or the controller side.</p>
      <div>
        <button class="primary" id="play">Play cycle</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
      </div>
      <h2>Motion</h2>
      <div id="motion"></div>
      <h2>Tool</h2>
      <div id="tool"></div>
      <h2>Fixtures</h2>
      <div id="fix"></div>
    </aside>
    <div class="stage">
      <svg id="svg" viewBox="0 0 980 620"></svg>
      <div class="bar">
        <div class="phase" id="phase">1 · Located</div>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
      </div>
    </div>
    <aside class="rail">
      <h2>Sensing</h2>
      <div id="sense"></div>
      <h2>Controls (Phase 1–2)</h2>
      <div id="ctrl"></div>
      <h2>Phase 3 — later</h2>
      <div id="later"></div>
      <p style="margin-top:16px">Loop is 16 s. Scrub the bar to freeze a pose.</p>
    </aside>
  </div>
  <script>
    const O = { x: 430, y: 355 };
    const S = 1.22;
    const svg = document.getElementById("svg");

    function iso(x, y, z) {
      return { x: O.x + (x - y) * 0.866 * S, y: O.y + (x + y) * 0.5 * S - z * S };
    }
    function lerp(a, b, u) { return a + (b - a) * u; }
    function clamp(u) { return Math.max(0, Math.min(1, u)); }
    function seg(t, a, b) { return clamp((t - a) / (b - a)); }

    function pose(t) {
      const pick = 52, dest = 188;
      let x = pick, z = 1, grip = 0, brX = pick, brZ = 0;
      if (t < 0.07) { z = 1; grip = 0; }
      else if (t < 0.16) { z = 1 - seg(t, 0.07, 0.16); grip = 0; }
      else if (t < 0.24) { z = 0; grip = seg(t, 0.16, 0.24); }
      else if (t < 0.36) { z = seg(t, 0.24, 0.36); grip = 1; brZ = z; }
      else if (t < 0.56) {
        z = 1; grip = 1; x = lerp(pick, dest, seg(t, 0.36, 0.56)); brX = x; brZ = 1;
      } else if (t < 0.68) {
        z = 1 - seg(t, 0.56, 0.68); grip = 1; x = dest; brX = dest; brZ = z;
      } else if (t < 0.76) { z = 0; grip = 1 - seg(t, 0.68, 0.76); x = dest; brX = dest; }
      else if (t < 0.86) { z = seg(t, 0.76, 0.86); grip = 0; x = dest; brX = dest; }
      else { z = 1; grip = 0; x = lerp(dest, pick, seg(t, 0.86, 1)); brX = dest; }
      const held = t >= 0.24 && t < 0.68;
      let phase = "1 · Located", move = "idle";
      if (t >= 0.07 && t < 0.16) { phase = "2 · Z down, jaws open"; move = "Z"; }
      else if (t >= 0.16 && t < 0.24) { phase = "3 · Close grip"; move = "grip"; }
      else if (t >= 0.24 && t < 0.36) { phase = "4 · Lift off pin"; move = "Z"; }
      else if (t >= 0.36 && t < 0.56) { phase = "5 · X transfer"; move = "X"; }
      else if (t >= 0.56 && t < 0.68) { phase = "6 · Set in pocket"; move = "Z"; }
      else if (t >= 0.68 && t < 0.86) { phase = "7 · Release + lift"; move = "grip + Z"; }
      else if (t >= 0.86) { phase = "Return home"; move = "X"; }
      return { x, z, grip, brX, brZ, held, phase, move, pick, dest };
    }

    const C = {
      stroke: "#1a1d22",
      benchT: "#3a3f46", benchL: "#2a2e34", benchR: "#32363d",
      aluT: "#cfd3d8", aluL: "#9aa0a8", aluR: "#b7bcc3",
      railT: "#4a5058", railL: "#2c3036", railR: "#3a4048",
      pin: "#d06a3a", pinT: "#e0a06a",
      jaw: "#4d8fd4", jawL: "#2f6eab",
      bear: "#9aa3ad", bearT: "#c5ccd3",
      pcb: "#1f6b3a", pcbT: "#2d8a4e",
      drv: "#3d3344",
      psu: "#2a2a2e",
      plc: "#5a6570",
      gold: "#d4a017",
      acc: "#6aa7e8",
      dim: "#8b949e",
    };

    function el(name, attrs) {
      const n = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }
    function poly(pts, fill, stroke) {
      const d = pts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ") + " Z";
      return el("path", { d, fill, stroke: stroke || C.stroke, "stroke-width": "0.8" });
    }
    function box(g, x, y, z, dx, dy, dz, top, left, right) {
      const T = [
        iso(x, y, z + dz), iso(x + dx, y, z + dz), iso(x + dx, y + dy, z + dz), iso(x, y + dy, z + dz),
      ];
      const R = [
        iso(x + dx, y, z), iso(x + dx, y + dy, z), iso(x + dx, y + dy, z + dz), iso(x + dx, y, z + dz),
      ];
      const L = [
        iso(x, y + dy, z), iso(x + dx, y + dy, z), iso(x + dx, y + dy, z + dz), iso(x, y + dy, z + dz),
      ];
      g.appendChild(poly(L, left));
      g.appendChild(poly(R, right));
      g.appendChild(poly(T, top));
    }
    function ellipsePath(cx, cy, cz, rx, ry) {
      const pts = [];
      for (let i = 0; i <= 26; i++) {
        const a = (i / 26) * Math.PI * 2;
        pts.push(iso(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, cz));
      }
      return pts;
    }
    function cylZ(g, cx, cy, z0, z1, r, side, top) {
      const a = iso(cx - r, cy, z0), b = iso(cx - r, cy, z1);
      const c = iso(cx + r, cy, z1), d = iso(cx + r, cy, z0);
      g.appendChild(poly([a, b, c, d], side));
      g.appendChild(poly(ellipsePath(cx, cy, z1, r, r), top));
    }
    function label(g, x, y, z, text, fill) {
      const p = iso(x, y, z);
      const t = el("text", { x: p.x, y: p.y, fill: fill || C.dim, "font-size": "11" });
      t.textContent = text;
      g.appendChild(t);
    }

    function draw(t) {
      const p = pose(t);
      svg.innerHTML = "";
      const g = el("g", {});
      svg.appendChild(g);

      for (let i = 0; i <= 9; i++) {
        const a = iso(8 + i * 26, 6, 0), b = iso(8 + i * 26, 118, 0);
        g.appendChild(el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "#23282f", "stroke-width": "1" }));
      }

      box(g, 6, 8, 0, 250, 112, 7, C.benchT, C.benchL, C.benchR);

      box(g, p.pick - 20, 46, 7, 40, 40, 11, C.aluT, C.aluL, C.aluR);
      cylZ(g, p.pick, 66, 18, 24, 3.3, C.pin, C.pinT);
      label(g, p.pick - 18, 90, 7, "PICKUP  pin + rest");

      box(g, p.dest - 20, 46, 7, 40, 40, 11, C.aluT, C.aluL, C.aluR);
      g.appendChild(poly(ellipsePath(p.dest, 66, 18.4, 12.5, 12.5), "#121417", "#3fa266"));
      label(g, p.dest - 16, 90, 7, "DEST  OD pocket");

      cylZ(g, p.pick - 2, 44, 14, 22, 3, C.gold, "#f0d078");
      cylZ(g, p.dest - 2, 44, 14, 22, 3, C.gold, "#f0d078");
      label(g, p.pick - 28, 40, 26, "prox", C.gold);
      label(g, p.dest + 8, 40, 26, "prox", C.gold);

      box(g, 18, 16, 36, 214, 13, 11, C.railT, C.railL, C.railR);
      box(g, 14, 17, 36, 12, 16, 18, C.railR, C.railL, C.railT);
      label(g, 200, 10, 52, "X rail  (1 powered axis)", C.acc);

      box(g, 10, 19, 40, 10, 8, 6, "#c45c4c", "#8a3a32", "#d07068");
      box(g, 228, 19, 40, 10, 8, 6, "#c45c4c", "#8a3a32", "#d07068");
      label(g, 6, 8, 52, "home LS", "#e08a84");
      label(g, 230, 8, 52, "end LS", "#e08a84");

      const zMm = lerp(11, 30, p.z);
      const jawGap = lerp(16, 10.5, p.grip);
      box(g, p.x - 18, 12, 47, 36, 20, 14, C.aluT, C.aluL, C.aluR);
      box(g, p.x - 8, 24, zMm + 20, 16, 12, 10, "#5a4638", "#3d2f28", "#6a5648");
      label(g, p.x + 12, 10, zMm + 36, "Z SG90", C.acc);
      box(g, p.x - 7, 30, zMm + 8, 14, 8, 14, C.aluR, C.aluL, C.aluT);
      box(g, p.x - 16, 38, zMm + 16, 32, 18, 8, C.aluT, C.aluL, C.aluR);
      box(g, p.x - 6, 42, zMm + 24, 12, 10, 7, "#5a4638", "#3d2f28", "#6a5648");
      label(g, p.x + 14, 56, zMm + 32, "grip SG90", C.acc);

      box(g, p.x - jawGap - 6, 50, zMm, 6, 18, 12, C.jaw, C.jawL, C.jaw);
      box(g, p.x + jawGap, 50, zMm, 6, 18, 12, C.jaw, C.jawL, C.jaw);

      const brZ = 18 + p.brZ * 19;
      cylZ(g, p.brX, 66, brZ, brZ + 7, 11, C.bear, C.bearT);
      g.appendChild(poly(ellipsePath(p.brX, 66, brZ + 7, 4, 4), "#121417", C.stroke));
      label(g, p.brX + 14, 78, brZ + 8, "608ZZ");

      box(g, 14, 88, 7, 46, 28, 6, C.pcbT, "#14522c", C.pcb);
      label(g, 14, 118, 16, "Mega R3");
      box(g, 66, 90, 7, 36, 24, 10, C.drv, "#2a2430", "#4a4054");
      label(g, 66, 118, 20, "TB6600");
      box(g, 108, 90, 7, 28, 22, 16, C.psu, "#1a1a1c", "#333");
      label(g, 108, 118, 26, "24 V");
      box(g, 142, 92, 7, 34, 20, 4, "#d8c56a", "#a89440", "#c4b050");
      label(g, 142, 116, 14, "breadboard");

      box(g, 200, 90, 7, 42, 26, 14, C.plc, "#3a444c", "#6a7580");
      const ghost = iso(200, 90, 24);
      const tg = el("text", { x: ghost.x, y: ghost.y - 8, fill: "#8b949e", "font-size": "11" });
      tg.textContent = "Micro820  (Phase 3 — do not buy yet)";
      g.appendChild(tg);

      document.getElementById("phase").textContent = p.phase;
    }

    const groups = {
      motion: [
        ["X gantry / V-slot", "One powered linear axis. Stepper + rail.", (t) => pose(t).move === "X"],
        ["NEMA17 + TB6600", "Drives X only. Extra kit axes stay unpowered.", (t) => pose(t).move === "X"],
        ["Z SG90 on EOAT", "15–20 mm lift. Not a gantry axis.", (t) => pose(t).move.includes("Z")],
      ],
      tool: [
        ["Grip SG90 + jaws", "Open/close only. Does not locate.", (t) => pose(t).move.includes("grip")],
        ["608ZZ bearing", "Donut. Payload, not the fixture.", () => true],
      ],
      fix: [
        ["Pickup nest + 1/4\" pin", "ID locates XY. Rest locates Z.", (t) => t < 0.36],
        ["Dest OD pocket", "Different datum. No pin.", (t) => t >= 0.56 && t < 0.9],
      ],
      sense: [
        ["Home / end limit switches", "X travel stops.", (t) => t < 0.08 || t > 0.86],
        ["Pickup prox", "Part present before cycle (F-01).", (t) => t < 0.36],
        ["Dest prox", "Place confirm (F-04).", (t) => t >= 0.68 && t < 0.9],
      ],
      ctrl: [
        ["ELEGOO Mega R3", "Motion controller. Already owned.", () => true],
        ["Breadboard + 24 V", "I/O bring-up and axis power.", () => true],
      ],
      later: [
        ["Micro820 PLC", "Supervisor later. Borrow first. Not Arduino-as-PLC.", () => false],
      ],
    };

    function paintLists(t) {
      for (const id of Object.keys(groups)) {
        const host = document.getElementById(id);
        host.innerHTML = "";
        for (const [name, note, on] of groups[id]) {
          const row = document.createElement("div");
          row.className = "item" + (on(t) ? " on" : "");
          row.innerHTML = `<i class="dot" style="background:${on(t) ? "#6aa7e8" : "#3a424c"}"></i><div><b>${name}</b><span>${note}</span></div>`;
          host.appendChild(row);
        }
      }
    }

    let t = 0, playing = false, last = 0;
    const dur = 16000;
    const scrub = document.getElementById("scrub");

    function frame(now) {
      if (playing) {
        if (!last) last = now;
        t += (now - last) / dur;
        last = now;
        if (t >= 1) t = 0;
        scrub.value = String(Math.round(t * 1000));
      } else last = 0;
      draw(t);
      paintLists(t);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    document.getElementById("play").onclick = () => { playing = true; };
    document.getElementById("pause").onclick = () => { playing = false; };
    document.getElementById("reset").onclick = () => { playing = false; t = 0; scrub.value = "0"; };
    scrub.oninput = () => { playing = false; t = Number(scrub.value) / 1000; };
  </script>
</body>
</html>
